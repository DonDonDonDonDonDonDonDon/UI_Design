<div>
  <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-700">
    {{ field.label }}{% if field.field.required %}<span class="ml-0.5 text-red-500">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
    <div class="helptext mt-1 text-xs leading-relaxed text-slate-500">{{ field.help_text|safe }}</div>
  {% endif %}
  {% for error in field.errors %}
    <p class="mt-1 text-xs text-red-600">{{ error }}</p>
  {% endfor %}
</div>
