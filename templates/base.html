{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}郵局網站{% endblock %}</title>
  <meta name="description" content="{% block description %}郵局官方網站{% endblock %}">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=7">
  {% block extra_head %}{% endblock %}
</head>
<body class="flex min-h-full flex-col bg-slate-50 text-slate-800 antialiased">
  {% include "partials/header.html" %}

  {% if messages %}
    <div class="mx-auto mt-4 w-full max-w-6xl px-4">
      {% for message in messages %}
        <div class="mb-2 rounded-lg border px-4 py-3 text-sm
          {% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800
          {% elif message.tags == 'error' %}border-red-200 bg-red-50 text-red-700
          {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
          {% else %}border-slate-200 bg-white text-slate-700{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
</body>
</html>
